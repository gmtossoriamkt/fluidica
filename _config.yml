# GitHub Pages (Jekyll) публикует ветку main как есть. Здесь только список того,
# что НЕ должно попадать на сайт. Папки с точкой (.claude/, .github/) Jekyll не публикует сам.
# Свой список exclude заменяет стандартный, поэтому CNAME перечислен явно (как в настройках GitHub Pages по умолчанию).
# Новый служебный файл или папку в корне репозитория - добавить сюда.
exclude:
  - CNAME
  - CLAUDE.md
  - content-plan.csv
  - factcheck/
  - scripts/
  - data/
  - components/
